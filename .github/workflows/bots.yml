---
name: Bots test build

# Windows, Linux, macOS, iPad and Android test build of the "bots" branch, published to its own "bots-test" release so the
# normal "latest" release stays as it is.

'on':
  push:
    branches: [bots]
    paths-ignore:
      - '**.md'
      - 'server/**'
  workflow_dispatch:
    inputs:
      only:
        description: 'Platforms to build: all makes a fresh release; any other choice replaces only those downloads'
        type: choice
        options: [all, all-but-android, android, linux, windows, macos, ios]
        default: all

env:
  SDL_VERSION: 2.32.10

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux x86_64
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && contains(fromJSON('["all","all-but-android","linux",""]'), inputs.only || '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -y install libsdl2-dev libgtk2.0-dev libasound2-dev
      - name: Build
        # FLAC and libvpx sonames differ between distributions; Blood needs neither
        run: make -j$(nproc) blood HAVE_FLAC=0 USE_LIBVPX=0 LTO=0
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-linux-x64
          path: ./notblood
          if-no-files-found: error

  build-windows:
    name: Windows x64
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && contains(fromJSON('["all","all-but-android","windows",""]'), inputs.only || '')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: >-
          msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: mingw64
          update: true
          cache: true
          install: git mingw-w64-x86_64-toolchain make
      - name: Build
        run: make -j$(nproc) blood SDLCONFIG= LTO=0
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-win64
          path: ./notblood.exe
          if-no-files-found: error

  build-macos:
    name: macOS (Apple Silicon + Intel)
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && contains(fromJSON('["all","all-but-android","macos",""]'), inputs.only || '')
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Build SDL2 (universal, static)
        run: |
          curl -fsSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar xf sdl.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B sdlbuild -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl"
          cmake --build sdlbuild -j4
          cmake --install sdlbuild
          # the makefile asks for --libs; a static SDL needs its frameworks too
          printf '#!/bin/sh\nif [ "$1" = "--libs" ]; then exec "%s/sdl/bin/sdl2-config" --static-libs; fi\nexec "%s/sdl/bin/sdl2-config" "$@"\n' "$PWD" "$PWD" > sdl2-config-static
          chmod +x sdl2-config-static
          ./sdl2-config-static --libs
      - name: Build (arm64)
        run: |
          make -j4 blood ARCH=arm64 SDLCONFIG="$PWD/sdl2-config-static" HAVE_FLAC=0 USE_LIBVPX=0 LTO=0
          mv notblood notblood-arm64
          make clean
      - name: Build (x86_64)
        run: |
          make -j4 blood ARCH=x86_64 SDLCONFIG="$PWD/sdl2-config-static" HAVE_FLAC=0 USE_LIBVPX=0 LTO=0
          mv notblood notblood-x86_64
      - name: Make the app
        run: |
          rm -rf NotBlood.app
          lipo -create -output notblood-universal notblood-arm64 notblood-x86_64
          lipo -info notblood-universal
          cp -R platform/Apple/bundles/NotBlood.app .
          mkdir -p NotBlood.app/Contents/MacOS
          cp notblood-universal NotBlood.app/Contents/MacOS/NotBlood
          cp notblood.pk3 NotBlood.app/Contents/Resources/
          plist=NotBlood.app/Contents/Info.plist
          version=$(sed -n 's/#define CHOSEN_VERSION "\(.*\)"/\1/p' source/blood/src/chosen.h)
          plutil -replace CFBundleIdentifier -string com.adrianpol.notblood-chosen "$plist"
          plutil -replace CFBundleName -string "NotBlood" "$plist"
          plutil -replace CFBundleShortVersionString -string "$version" "$plist"
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$plist"
          plutil -replace LSMinimumSystemVersion -string "11.0" "$plist"
          plutil -replace NSHighResolutionCapable -bool true "$plist"
          plutil -lint "$plist"
          codesign --force --deep -s - NotBlood.app
          codesign --verify --verbose NotBlood.app
          ditto -c -k --keepParent NotBlood.app NotBlood.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-macos
          path: ./NotBlood.app.zip
          if-no-files-found: error

  build-android:
    name: Android
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && contains(fromJSON('["all","android",""]'), inputs.only || '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch SDL2 and gl4es
        run: platform/Android/fetch-deps.sh
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NOTBLOOD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # the same signing key as the normal builds, so it installs over them
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export NOTBLOOD_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          gradle -p platform/Android assembleRelease --no-daemon \
            -PversionCode=$((1000 + ${{ github.run_number }})) -Pabis=arm64-v8a,armeabi-v7a,x86_64
          cp platform/Android/app/build/outputs/apk/release/app-release.apk NotBlood.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs NotBlood.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-android
          path: ./NotBlood.apk
          if-no-files-found: error

  build-ios:
    name: iPad / iPhone (unsigned IPA)
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && contains(fromJSON('["all","all-but-android","ios",""]'), inputs.only || '')
    runs-on: macos-latest
    env:
      GL4ES_COMMIT: ec16bedd8819c475326f4f1a3063772c6d986e06
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SDL2 and gl4es
        run: |
          mkdir -p third_party
          curl -fsSL -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar xzf sdl2.tar.gz -C third_party
          curl -fsSL -o gl4es.tar.gz "https://github.com/ptitSeb/gl4es/archive/${GL4ES_COMMIT}.tar.gz"
          tar xzf gl4es.tar.gz -C third_party
          for p in platform/iOS/gl4es/*.patch; do
            patch -d "third_party/gl4es-${GL4ES_COMMIT}" -p1 --forward < "$p"
          done
      - name: Build
        run: |
          set -o pipefail
          cmake -S platform/iOS -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSDL2_SOURCE_DIR="$PWD/third_party/SDL2-${SDL_VERSION}" \
            -DGL4ES_SOURCE_DIR="$PWD/third_party/gl4es-${GL4ES_COMMIT}" \
            -DNOTBLOOD_BUILD=${{ github.run_number }}
          cmake --build build-ios --config Release --target NotBlood -- \
            -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -40
      - name: Package IPA
        run: |
          APP=$(find build-ios -type d -name NotBlood.app -path '*Release-iphoneos*' | head -n 1)
          test -n "$APP" || { echo "NotBlood.app not found"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../NotBlood.ipa Payload)
          ls -la NotBlood.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-ios
          path: ./NotBlood.ipa
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build-linux, build-windows, build-macos, build-ios, build-android]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          for target in win64 linux-x64; do
            [ -d "artifacts/notblood-$target" ] || continue
            dir="pkg/$target/NotBlood"
            mkdir -p "$dir/autoload" "$dir/addons" "$dir/mods" "$dir/movie"
            cp artifacts/notblood-$target/* "$dir/"
            cp notblood.pk3 "$dir/"
            cp package/common/*.txt "$dir/"
            mv "$dir/addons.txt" "$dir/autoload/"
            cp package/release/README.txt "$dir/README - NotBlood Chosen.txt"
            cp package/release/BOTS.md "$dir/README - Bots.txt"
            cp package/release/addons.txt "$dir/addons/Put add-on episodes here.txt"
            cp package/release/mods.txt "$dir/mods/Put mods here.txt"
            cp package/release/movie.txt "$dir/movie/Put the movie files here.txt"
            chmod +x "$dir/notblood" 2>/dev/null || true
            (cd "pkg/$target" && zip -9 -r "../../NotBlood-Chosen-bots-$target.zip" NotBlood)
          done
          if [ -f artifacts/notblood-macos/NotBlood.app.zip ]; then
            dir=pkg/macos/NotBlood
            mkdir -p "$dir/addons" "$dir/mods" "$dir/movie"
            (cd "$dir" && unzip -q ../../../artifacts/notblood-macos/NotBlood.app.zip)
            cp package/release/README.txt "$dir/README - NotBlood Chosen.txt"
            cp package/release/BOTS.md "$dir/README - Bots.txt"
            cp package/release/addons.txt "$dir/addons/Put add-on episodes here.txt"
            cp package/release/mods.txt "$dir/mods/Put mods here.txt"
            cp package/release/movie.txt "$dir/movie/Put the movie files here.txt"
            (cd pkg/macos && zip -9 -r -y "../../NotBlood-Chosen-bots-macos.zip" NotBlood)
          fi
          if [ -f artifacts/notblood-ios/NotBlood.ipa ]; then
            cp artifacts/notblood-ios/NotBlood.ipa NotBlood-Chosen-bots-ios.ipa
          fi
          if [ -f artifacts/notblood-android/NotBlood.apk ]; then
            cp artifacts/notblood-android/NotBlood.apk NotBlood-Chosen-bots-android.apk
          fi
          ls -l NotBlood-Chosen-bots-*
      - name: Publish to the "bots-test" release
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" -q .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch head is $HEAD_SHA, this run built $GITHUB_SHA - not publishing."
            exit 0
          fi
          files=$(ls NotBlood-Chosen-bots-*)
          platforms() {
            names=""
            for f in "$@"; do
              case "$f" in *win64*) n=Windows ;; *linux*) n=Linux ;; *macos*) n=macOS ;; *ios*) n=iPad ;; *android*) n=Android ;; *) continue ;; esac
              names="${names:+$names, }$n"
            done
            echo "$names"
          }
          if [ "$ONLY" != all ] && gh release view bots-test >/dev/null 2>&1; then
            # replace only the downloads built now; the others stay
            gh release upload bots-test $files --clobber
            all=$(gh release view bots-test --json assets -q '.assets[].name' | sort)
            gh release edit bots-test --title "NotBlood Chosen with bots - test build ${{ github.run_number }} ($(platforms $all))"
          else
            # a fresh release, so its tag points at this commit
            if gh release view bots-test >/dev/null 2>&1; then
              gh release delete bots-test --cleanup-tag -y
            fi
            gh release create bots-test $files --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "NotBlood Chosen with bots - test build ${{ github.run_number }} ($(platforms $files))" --notes-file package/release/BOTS.md
          fi
