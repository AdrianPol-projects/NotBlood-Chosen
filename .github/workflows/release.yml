---
name: Release builds

# Ready-to-play builds of NotBlood Chosen (co-op saves, online lobbies, mods menu, ...) for
# Windows, Linux, macOS, Android and iPad, published to the release "v<CHOSEN_VERSION>" (e.g. v1.2) of
# AdrianPol-projects/NotBlood-Chosen, marked as the latest release; notes: package/release/NOTES.md.
# Every machine in a network game needs the same version (CHOSEN_VERSION in source/blood/src/chosen.h).
# The iPad build comes from ios.yml in AdrianPol-projects/NotBlood-iOS.

'on':
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'server/**'
  workflow_dispatch:
    inputs:
      only:
        description: 'Platforms to build: all; only macos, android or web (then only that download of the release is replaced); android-test (an APK artifact, nothing published)'
        type: choice
        options: [all, macos, android, web, android-test]
        default: all

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: 2.32.10

jobs:
  build-linux:
    name: Linux x86_64
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -y install libsdl2-dev libgtk2.0-dev libasound2-dev
      - name: Build
        # FLAC and libvpx sonames differ between distributions; Blood needs neither
        run: make -j$(nproc) blood HAVE_FLAC=0 USE_LIBVPX=0 LTO=0
      - name: Check dependencies
        run: |
          readelf -d ./notblood | grep NEEDED
          if readelf -d ./notblood | grep -E 'libFLAC|libvpx'; then
            echo "binary depends on a library with a distribution specific soname"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-linux-x64
          path: ./notblood
          if-no-files-found: error

  build-windows:
    name: Windows x64
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: >-
          msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: mingw64
          update: true
          cache: true
          install: git mingw-w64-x86_64-toolchain make
      - name: Build
        run: make -j$(nproc) blood SDLCONFIG= LTO=0
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-win64
          path: ./notblood.exe
          if-no-files-found: error

  build-macos:
    name: macOS (Apple Silicon + Intel)
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'macos')
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Build SDL2 (universal, static)
        run: |
          curl -fsSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar xf sdl.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B sdlbuild -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl"
          cmake --build sdlbuild -j4
          cmake --install sdlbuild
          # the makefile asks for --libs; a static SDL needs its frameworks too
          printf '#!/bin/sh\nif [ "$1" = "--libs" ]; then exec "%s/sdl/bin/sdl2-config" --static-libs; fi\nexec "%s/sdl/bin/sdl2-config" "$@"\n' "$PWD" "$PWD" > sdl2-config-static
          chmod +x sdl2-config-static
          ./sdl2-config-static --libs
      - name: Build (arm64)
        run: |
          make -j4 blood ARCH=arm64 SDLCONFIG="$PWD/sdl2-config-static" HAVE_FLAC=0 USE_LIBVPX=0 LTO=0
          mv notblood notblood-arm64
          make clean
      - name: Build (x86_64)
        run: |
          make -j4 blood ARCH=x86_64 SDLCONFIG="$PWD/sdl2-config-static" HAVE_FLAC=0 USE_LIBVPX=0 LTO=0
          mv notblood notblood-x86_64
      - name: Make the app
        run: |
          rm -rf NotBlood.app
          lipo -create -output notblood-universal notblood-arm64 notblood-x86_64
          lipo -info notblood-universal
          cp -R platform/Apple/bundles/NotBlood.app .
          mkdir -p NotBlood.app/Contents/MacOS
          cp notblood-universal NotBlood.app/Contents/MacOS/NotBlood
          cp notblood.pk3 NotBlood.app/Contents/Resources/
          plist=NotBlood.app/Contents/Info.plist
          version=$(sed -n 's/#define CHOSEN_VERSION "\(.*\)"/\1/p' source/blood/src/chosen.h)
          plutil -replace CFBundleIdentifier -string com.adrianpol.notblood-chosen "$plist"
          plutil -replace CFBundleName -string "NotBlood" "$plist"
          plutil -replace CFBundleShortVersionString -string "$version" "$plist"
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$plist"
          plutil -replace LSMinimumSystemVersion -string "11.0" "$plist"
          plutil -replace NSHighResolutionCapable -bool true "$plist"
          plutil -lint "$plist"
          codesign --force --deep -s - NotBlood.app
          codesign --verify --verbose NotBlood.app
          ditto -c -k --keepParent NotBlood.app NotBlood.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-macos
          path: ./NotBlood.app.zip
          if-no-files-found: error

  build-android:
    name: Android
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || startsWith(inputs.only, 'android'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch SDL2 and gl4es
        run: platform/Android/fetch-deps.sh
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NOTBLOOD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # the same signing key every time, so new versions install over old ones; versionCode above
          # the bots test builds (1000+)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export NOTBLOOD_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          gradle -p platform/Android assembleRelease --no-daemon \
            -PversionCode=$((2000 + ${{ github.run_number }})) -Pabis=arm64-v8a,armeabi-v7a,x86_64
          cp platform/Android/app/build/outputs/apk/release/app-release.apk NotBlood.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs NotBlood.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-android
          path: ./NotBlood.apk
          if-no-files-found: error
      # libmain.so with its symbols, to turn the offsets of a crash report in notblood.log into lines
      - name: Collect native symbols
        run: |
          mkdir symbols
          for f in $(find platform/Android/app/build/intermediates -path '*merged_native_libs*' -name libmain.so); do
            abi=$(basename "$(dirname "$f")")
            mkdir -p "symbols/$abi" && cp "$f" "symbols/$abi/"
          done
          ls -lR symbols
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-android-symbols
          path: ./symbols

  build-ios:
    name: iPad / iPhone (unsigned IPA)
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all')
    runs-on: macos-latest
    env:
      GL4ES_COMMIT: ec16bedd8819c475326f4f1a3063772c6d986e06
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SDL2 and gl4es
        run: |
          mkdir -p third_party
          curl -fsSL -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar xzf sdl2.tar.gz -C third_party
          curl -fsSL -o gl4es.tar.gz "https://github.com/ptitSeb/gl4es/archive/${GL4ES_COMMIT}.tar.gz"
          tar xzf gl4es.tar.gz -C third_party
          for p in platform/iOS/gl4es/*.patch; do
            patch -d "third_party/gl4es-${GL4ES_COMMIT}" -p1 --forward < "$p"
          done
      - name: Build
        run: |
          set -o pipefail
          cmake -S platform/iOS -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSDL2_SOURCE_DIR="$PWD/third_party/SDL2-${SDL_VERSION}" \
            -DGL4ES_SOURCE_DIR="$PWD/third_party/gl4es-${GL4ES_COMMIT}" \
            -DNOTBLOOD_BUILD=${{ github.run_number }}
          cmake --build build-ios --config Release --target NotBlood -- \
            -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -40
      - name: Package IPA
        run: |
          APP=$(find build-ios -type d -name NotBlood.app -path '*Release-iphoneos*' | head -n 1)
          test -n "$APP" || { echo "NotBlood.app not found"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../NotBlood.ipa Payload)
          ls -la NotBlood.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-ios
          path: ./NotBlood.ipa
          if-no-files-found: error

  # the web version (WebAssembly): the relay server (server/relay.py) installs this zip and serves it at /play
  build-web:
    name: Web browsers (WebAssembly)
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'web')
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 4.0.15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Emscripten
        run: |
          [ -d ~/emsdk ] || git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION" > /dev/null
          ~/emsdk/emsdk activate "$EMSDK_VERSION" > /dev/null
      - name: Build
        run: EMSDK=~/emsdk bash platform/Web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-web
          path: build-web/NotBlood-Chosen-*-web.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build-linux, build-windows, build-macos, build-android, build-ios, build-web]
    # skipped jobs (a macOS-, Android- or web-only run) are fine, failed ones are not
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.only != 'android-test' && (needs.build-macos.result == 'success' || inputs.only == 'android' || inputs.only == 'web') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        env:
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          version=$(sed -n 's/#define CHOSEN_VERSION "\(.*\)"/\1/p' source/blood/src/chosen.h)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          targets="linux-x64 win64"
          [ "$ONLY" = all ] || targets=""
          for target in $targets; do
            dir="pkg/$target/NotBlood"
            mkdir -p "$dir/autoload" "$dir/addons" "$dir/mods" "$dir/movie"
            cp artifacts/notblood-$target/* "$dir/"
            cp notblood.pk3 "$dir/"
            cp package/common/*.txt "$dir/"
            mv "$dir/addons.txt" "$dir/autoload/"
            cp package/release/README.txt "$dir/README - NotBlood Chosen.txt"
            cp package/release/BOTS.md "$dir/README - Bots.txt"
            cp package/release/addons.txt "$dir/addons/Put add-on episodes here.txt"
            cp package/release/mods.txt "$dir/mods/Put mods here.txt"
            cp package/release/movie.txt "$dir/movie/Put the movie files here.txt"
            chmod +x "$dir/notblood" 2>/dev/null || true
            (cd "pkg/$target" && zip -9 -r "../../NotBlood-Chosen-$version-$target.zip" NotBlood)
          done
          if [ "$ONLY" = all ] || [ "$ONLY" = macos ]; then
            dir=pkg/macos/NotBlood
            mkdir -p "$dir/addons" "$dir/mods" "$dir/movie"
            (cd "$dir" && unzip -q ../../../artifacts/notblood-macos/NotBlood.app.zip)
            cp package/release/README.txt "$dir/README - NotBlood Chosen.txt"
            cp package/release/BOTS.md "$dir/README - Bots.txt"
            cp package/release/addons.txt "$dir/addons/Put add-on episodes here.txt"
            cp package/release/mods.txt "$dir/mods/Put mods here.txt"
            cp package/release/movie.txt "$dir/movie/Put the movie files here.txt"
            (cd pkg/macos && zip -9 -r -y "../../NotBlood-Chosen-$version-macos.zip" NotBlood)
          fi
          if [ "$ONLY" = all ] || [ "$ONLY" = android ]; then
            cp artifacts/notblood-android/NotBlood.apk "NotBlood-Chosen-$version-android.apk"
          fi
          if [ "$ONLY" = all ]; then
            cp artifacts/notblood-ios/NotBlood.ipa "NotBlood-Chosen-$version-ios.ipa"
          fi
          if [ "$ONLY" = all ] || [ "$ONLY" = web ]; then
            cp artifacts/notblood-web/NotBlood-Chosen-*-web.zip .
          fi
          ls -l NotBlood-Chosen-*
      - name: Publish to the release of this version
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          # Runs can be queued late; never let an older commit replace a newer build.
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" -q .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch head is $HEAD_SHA, this run built $GITHUB_SHA - not publishing."
            exit 0
          fi
          TAG="v$VERSION"
          if [ "$ONLY" = macos ] || [ "$ONLY" = android ] || [ "$ONLY" = web ]; then
            # replace only that platform's download; the others stay as they are
            case "$ONLY" in
              macos) pattern='-macos\.zip$'; file=$(ls NotBlood-Chosen-*-macos.zip); name=macOS ;;
              android) pattern='-android\.apk$'; file=$(ls NotBlood-Chosen-*-android.apk); name=Android ;;
              web) pattern='-web\.zip$'; file=$(ls NotBlood-Chosen-*-web.zip); name=web ;;
            esac
            gh release view "$TAG" >/dev/null
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -- "$pattern"); do
              gh release delete-asset "$TAG" "$a" -y
            done
            gh release upload "$TAG" "$file" --clobber
            # keep the notes of earlier single-platform updates
            gh release view "$TAG" --json body -q .body | grep '^_The .* download was updated on its own' | grep -v "^_The $name " > earlier.txt || true
            { cat package/release/NOTES.md; echo; cat earlier.txt; echo "_The $name download was updated on its own in build ${{ github.run_number }} (commit ${GITHUB_SHA::7}); the other downloads are from the build in the title._"; } > notes.md
            gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi
          TITLE="NotBlood Chosen $VERSION (build ${{ github.run_number }})"
          files=$(ls NotBlood-Chosen-*.zip NotBlood-Chosen-*.apk NotBlood-Chosen-*.ipa)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # drop the zips of the previous build, their names carry the version
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" -y
            done
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file package/release/NOTES.md --prerelease=false --latest
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --latest --title "$TITLE" --notes-file package/release/NOTES.md
          fi
