---
name: Extra Crispy test build

# Android test build of the "extracrispy" branch (Blood Extra Crispy as a mod), published to its own
# "extracrispy-test" pre-release so the normal release stays as it is. The app is "NotBlood Crispy"
# (com.adrianpol.notblood.crispy): it installs next to NotBlood and uses the same NotBlood folder.

'on':
  push:
    branches: [extracrispy]
    paths-ignore:
      - '**.md'
      - 'server/**'
  workflow_dispatch:

env:
  SDL_VERSION: 2.32.10

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    if: github.repository == 'AdrianPol-projects/NotBlood-Chosen'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch SDL2 and gl4es
        run: platform/Android/fetch-deps.sh
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NOTBLOOD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export NOTBLOOD_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          gradle -p platform/Android assembleRelease --no-daemon \
            -PversionCode=$((3000 + ${{ github.run_number }})) -Pabis=arm64-v8a,armeabi-v7a,x86_64 \
            -PappIdSuffix=.crispy "-PappName=NotBlood Crispy"
          cp platform/Android/app/build/outputs/apk/release/app-release.apk NotBlood-Crispy.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs NotBlood-Crispy.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: notblood-crispy-android
          path: ./NotBlood-Crispy.apk
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notblood-crispy-android
      - name: Publish to the "extracrispy-test" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/#define CHOSEN_VERSION "\(.*\)"/\1/p' source/blood/src/chosen.h)
          file="NotBlood-Chosen-$version-ExtraCrispy-test-android.apk"
          mv NotBlood-Crispy.apk "$file"
          title="NotBlood Chosen $version + Blood Extra Crispy - Android test build ${{ github.run_number }}"
          # a fresh pre-release each time, so its tag points at this commit
          if gh release view extracrispy-test >/dev/null 2>&1; then
            gh release delete extracrispy-test -y --cleanup-tag
          fi
          gh release create extracrispy-test "$file" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$title" --notes-file package/release/NOTES-ExtraCrispy.md
