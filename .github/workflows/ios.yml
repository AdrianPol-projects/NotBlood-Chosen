---
name: iOS IPA build

'on':
  push:
    branches: [ios]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL2_VERSION: 2.32.10
  GL4ES_COMMIT: ec16bedd8819c475326f4f1a3063772c6d986e06

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Fetch SDL2
        run: |
          curl -fsSL -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          mkdir -p third_party
          tar xzf sdl2.tar.gz -C third_party

      - name: Fetch gl4es
        run: |
          curl -fsSL -o gl4es.tar.gz "https://github.com/ptitSeb/gl4es/archive/${GL4ES_COMMIT}.tar.gz"
          mkdir -p third_party
          tar xzf gl4es.tar.gz -C third_party
          for p in platform/iOS/gl4es/*.patch; do
            patch -d "third_party/gl4es-${GL4ES_COMMIT}" -p1 --forward < "$p"
          done

      - name: Configure
        run: |
          cmake -S platform/iOS -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSDL2_SOURCE_DIR="$PWD/third_party/SDL2-${SDL2_VERSION}" \
            -DGL4ES_SOURCE_DIR="$PWD/third_party/gl4es-${GL4ES_COMMIT}" \
            -DNOTBLOOD_BUILD=${{ github.run_number }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-ios --config Release --target NotBlood -- \
            -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build-ios -type d -name NotBlood.app -path '*Release-iphoneos*' | head -n 1)
          test -n "$APP" || { echo "NotBlood.app not found"; exit 1; }
          echo "App bundle: $APP"
          ls -la "$APP"
          plutil -p "$APP/Info.plist"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../NotBlood.ipa Payload)
          ls -la NotBlood.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NotBlood-ios-${{ github.run_number }}
          path: NotBlood.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # only the ios branch publishes; test branches keep the IPA as a workflow artifact
      - name: Publish to the release of this version (v<CHOSEN_VERSION>)
        if: github.ref_name == 'ios' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs can be queued late; never let an older commit replace a newer IPA.
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" -q .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch head is $HEAD_SHA, this run built $GITHUB_SHA - not publishing."
            exit 0
          fi
          VERSION=$(sed -n 's/#define CHOSEN_VERSION "\(.*\)"/\1/p' source/blood/src/chosen.h)
          TAG="v$VERSION"
          TITLE="Blood for iPad and iPhone - NotBlood Chosen $VERSION (build ${{ github.run_number }})"
          # Replace the asset in place so the release is never left empty.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NotBlood.ipa --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file package/release/NOTES-iOS.md --prerelease=false --latest
          else
            gh release create "$TAG" NotBlood.ipa --target "$GITHUB_SHA" --latest --title "$TITLE" --notes-file package/release/NOTES-iOS.md
          fi
