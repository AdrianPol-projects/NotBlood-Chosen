name: mac smoke test
'on':
  push:
    branches: [macdebug]
env:
  SDL_VERSION: 2.32.10
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Get release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R ${{ github.repository }} -p '*macos.zip'
          mkdir test && cd test && unzip -q ../*.zip && ls -la NotBlood
      - name: Run directly
        run: |
          cd test/NotBlood
          ./NotBlood.app/Contents/MacOS/NotBlood > run1.txt 2>&1 &
          pid=$!
          sleep 15
          screencapture -x ../../shot-direct.png || true
          if kill -0 $pid 2>/dev/null; then echo STILL RUNNING; kill -9 $pid || true; else wait $pid || echo "exit $?"; fi
          tail -100 run1.txt || true
          ls -la
          tail -100 ~/Library/Logs/notblood.log || true
      - name: Run with open
        run: |
          rm -f ~/Library/Logs/notblood.log
          open test/NotBlood/NotBlood.app
          sleep 15
          screencapture -x shot-open.png || true
          pgrep -lx NotBlood || echo "not running"
          pkill -9 -x NotBlood || true
          tail -100 ~/Library/Logs/notblood.log || true
          ls -la test/NotBlood
      - name: Crash reports
        if: always()
        run: |
          sleep 10
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          for f in ~/Library/Logs/DiagnosticReports/NotBlood*; do [ -e "$f" ] || continue; echo "== $f"; head -c 12000 "$f"; echo; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: |
            shot-*.png
            test/NotBlood/run1.txt
